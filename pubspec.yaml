name: flutter_refined_kit
description: >
  A reusable toolkit of premium motion, visual-FX, UI, and utility primitives
  for Flutter apps -- damped spring physics, ambient glow shaders, procedural
  grain overlays, tactile press feedback, hysteresis scroll tracking,
  Bayesian weighted ranking, cross-platform file export, and more. Zero
  domain coupling, pure parameter-driven APIs, no global singletons.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.3
  share_plus: ^13.3.0
  web: ^1.0.0
  shared_preferences: ^2.5.5
  # A library package consumed via path dependency alongside apps that pin
  # their own google_fonts version (The Lounge is on ^6.2.1) shouldn't force
  # every consumer onto whatever's latest -- a broad compatible range lets
  # each app's own pubspec pick the resolved version instead of this kit
  # being the forcing function for an app-side major-version bump.
  google_fonts: '>=6.2.1 <9.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

dependency_overrides:
  # Matches the-lounge's own override -- file_picker ^11.0.3 and
  # share_plus ^13.3.0 pin incompatible win32 ranges otherwise. Keep this in
  # sync with the-lounge/pubspec.yaml's own override until one of those two
  # packages' constraints loosen.
  win32: ^5.9.0

